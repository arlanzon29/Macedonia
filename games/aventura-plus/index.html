<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
// AVENTURA+ — la aventura de Kael (Villahoja AR) rehecha con la máxima calidad.
// El mismo juego: Kael con espada y escudo, slimes y pulpos, hierba y arbustos que se
// cortan, cofres... pero con un valle mucho más grande (meseta con bosque, río con
// cascada, lago y pueblo con vecinos), un santuario con puzles y un jefe final.
// Gráficos de "maqueta de juguete": sombras suaves, materiales con brillo, agua animada,
// hierba que se mueve con el viento y se aparta al pasar, sombras de nubes y, en el
// monitor, desenfoque de miniatura (tilt-shift) y resplandor.
// En realidad mixta (Meta Quest) el valle es una maqueta sobre tu mesa real, como en
// Villahoja AR: se coloca con el botón de agarre y los bordes se funden en niebla.
//   Monitor: FLECHAS / WASD mover · ESPACIO / J espada (mantener: ataque giratorio) ·
//            E / ENTER acción (hablar, leer, abrir, levantar, lanzar) · ESC / P pausa · M sonido
//   Mando:   stick / cruceta mover · B / X espada · A acción · START pausa
//   Táctil:  joystick a la izquierda · ⚔ espada · A acción
//   AR:      JOYSTICK IZQ. mover · GATILLO espada · A / X acción · B / Y pausa ·
//            AGARRE: mover y girar la maqueta (con los dos: cambiar su tamaño) ·
//            JOYSTICK DER.: girar (izq./der.) y acercar/alejar (arriba/abajo) la maqueta
//   VR:      igual que en AR, pero a lo grande y en tercera persona, detrás de Kael ·
//            JOYSTICK DER.: girar la cámara a saltos de 30° · AGARRE: recentrar la vista
// =====================================================================

const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const suave = (v, obj, k, dt) => v + (obj - v) * (1 - Math.exp(-k * dt));      // amortiguado independiente de los fps
const angDif = (a, b) => { let d = (a - b) % TAU; if (d > PI) d -= TAU; else if (d < -PI) d += TAU; return d; };
const suaveAng = (v, obj, k, dt) => v + angDif(obj, v) * (1 - Math.exp(-k * dt));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hash2 = (x, z) => hash(x * 157.31 + z * 311.17);
const azar = (a = 0, b = 1) => a + Math.random() * (b - a);
const elegir = arr => arr[Math.floor(Math.random() * arr.length)];
// ruido de valor suave (determinista): para el terreno, las rocas y las texturas
function ruido2(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), fx = x - xi, fz = z - zi;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  return lerp(lerp(hash2(xi, zi), hash2(xi + 1, zi), u), lerp(hash2(xi, zi + 1), hash2(xi + 1, zi + 1), u), v);
}
const fbm = (x, z) => ruido2(x, z) * .55 + ruido2(x * 2.13 + 17.1, z * 2.13 + 9.3) * .3 + ruido2(x * 4.37 + 3.7, z * 4.37 + 41.9) * .15;
const ruido3 = (x, y, z) => (ruido2(x + y * 1.71, z - y * .93) + ruido2(z * 1.13 + 5.1, y * 1.37 + x * .21)) * .5;

const esTactil = matchMedia('(hover: none) and (pointer: coarse)').matches;
if (esTactil) document.body.classList.add('tactil');
const cargaBarra = document.getElementById('carga-barra'), cargaTxt = document.getElementById('carga-txt');
const progreso = (f, txt) => { cargaBarra.style.width = Math.round(f * 100) + '%'; if (txt) cargaTxt.textContent = txt; };
const respiro = () => new Promise(r => setTimeout(r, 0));     // deja pintar la barra de carga entre pasos

// =====================================================================
// ERRORES: se muestran en pantalla (y en el panel de AR) para poder contarlos desde las gafas
// =====================================================================
const ERRORES = [];
function anotarError(msg) { if (ERRORES.length < 4) ERRORES.push(String(msg).slice(0, 160)); console.error(msg); }
addEventListener('error', e => anotarError(e.message + (e.lineno ? ' (línea ' + e.lineno + ')' : '')));
addEventListener('unhandledrejection', e => anotarError('Promesa: ' + (e.reason?.message || e.reason)));

// =====================================================================
// CALIDAD GRÁFICA: alta (posproceso), media o baja. Se ajusta sola si va lento.
// =====================================================================
const CAL = {
  nivel: esTactil ? 1 : 2,
  get post() { return this.nivel >= 2; },
  get dpr() { return Math.min(devicePixelRatio, [1, 1.5, 2][this.nivel]); },
  get sombra() { return [1024, 2048, 2048][this.nivel]; },
  get hierba() { return [.35, .7, 1][this.nivel]; },
};
try { const c = localStorage.getItem('aventura-plus-calidad'); if (c !== null) CAL.nivel = clamp(+c, 0, 2); } catch {}

// =====================================================================
// RENDERIZADOR, ESCENA, CÁMARA Y LUCES
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(CAL.dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.domElement.id = 'gl';
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
// "mundo" lleva todo el contenido del área actual (terreno, objetos, personajes y luces).
// En el monitor no se mueve; en AR se escala y se coloca sobre la mesa real.
const mundo = new THREE.Group(); mundo.name = 'mundo'; scene.add(mundo);
const camara = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 220);
const CIELO = new THREE.Color(0xa8d4f0);
scene.background = CIELO.clone();
scene.fog = new THREE.Fog(CIELO.clone(), 20, 46);

const hemi = new THREE.HemisphereLight(0xdcefff, 0x5d7a3e, 1.15); mundo.add(hemi);
const sol = new THREE.DirectionalLight(0xfff1dc, 2.9);
sol.castShadow = true;
sol.shadow.mapSize.set(CAL.sombra, CAL.sombra);
mundo.add(sol, sol.target);
const SOL_DIR = new THREE.Vector3(-.5, 1, .62).normalize();       // hacia el sol: sombras hacia el noreste
// el encuadre de la sombra sigue a Kael; en AR se mide en metros (la maqueta va escalada)
function ajustarSombra(escala) {
  const sc = sol.shadow.camera, r = 14 * escala;
  sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.near = .5 * escala; sc.far = 60 * escala;
  sc.updateProjectionMatrix();
  sol.shadow.bias = -.0005; sol.shadow.normalBias = .03 * escala;
}
ajustarSombra(1);

// mapa de entorno: un cielo degradado con sol, para reflejos suaves en los materiales con brillo
function crearEntorno() {
  const pm = new THREE.PMREMGenerator(renderer), esc = new THREE.Scene();
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `varying vec3 vP;
      void main(){
        vec3 d = normalize(vP); float y = d.y;
        vec3 cielo = mix(vec3(.82, .9, 1.0), vec3(.32, .55, .95), clamp(y * 1.4, 0.0, 1.0));
        vec3 suelo = mix(vec3(.5, .56, .38), vec3(.26, .3, .18), clamp(-y * 2.0, 0.0, 1.0));
        vec3 c = y > 0.0 ? cielo : suelo;
        c += vec3(1.0, .95, .85) * pow(max(dot(d, normalize(vec3(-.5, 1.0, .62))), 0.0), 180.0) * 18.0;
        gl_FragColor = vec4(c, 1.0);
      }` });
  esc.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), m));
  const t = pm.fromScene(esc, 0).texture; pm.dispose(); m.dispose();
  return t;
}
scene.environment = crearEntorno();

// =====================================================================
// SHADERS COMUNES: se meten en los trozos de shader de three, así afectan a todo.
//  · Ventana AR: todo lo que queda fuera del rectángulo uVentana (en casillas del mapa)
//    se desvanece en una franja de bruma y se vuelve translúcido hasta dejar ver la
//    habitación real; más allá no se dibuja. La transparencia sale por el alfa del lienzo,
//    que el passthrough del Quest mezcla con la cámara: en los materiales opacos el color
//    va premultiplicado por ese alfa (igual que en Villahoja AR).
//  · Viento: la hierba y las copas de los árboles se mecen; la hierba se aparta de Kael.
//  · Sombras de nubes que pasan por encima del valle.
//  · Oclusión: en el monitor, lo que tapa a Kael (copas, tejados) se cala en un círculo.
//  · Detalle: una textura de ruido fino sobre el terreno.
// "vMapa" es la posición en coordenadas del mapa (casillas), sea cual sea la escala de AR.
// =====================================================================
const U = {
  uTiempo: { value: 0 },
  uMundoInv: { value: new THREE.Matrix4() },
  uVentana: { value: new THREE.Vector4(0, 0, 1e5, 1e5) },
  uVentanaBorde: { value: 1.6 },
  uHeroe: { value: new THREE.Vector3(0, -99, 0) },
  uNubes: { value: null },
  uNubesFuerza: { value: .32 },
  uOclusion: { value: new THREE.Vector4(0, 0, 0, 0) },
  uDetalle: { value: null },
};
THREE.ShaderChunk.common += `
#define AVENTURA
uniform float uTiempo; uniform mat4 uMundoInv; uniform vec4 uVentana; uniform float uVentanaBorde;
uniform vec3 uHeroe; uniform sampler2D uNubes; uniform float uNubesFuerza; uniform vec4 uOclusion; uniform sampler2D uDetalle;
varying vec3 vMapa;
float bayer2( vec2 a ) { a = floor( a ); return fract( dot( a, vec2( .5, a.y * .75 ) ) ); }
float bayer4( vec2 a ) { return bayer2( .5 * a ) * .25 + bayer2( a ); }
`;
// (solo en el vertex shader: usa el atributo de color)
THREE.ShaderChunk.uv_pars_vertex += `
#if defined( VIENTO ) || defined( VIENTO_HIERBA )
vec3 desplazarViento( vec3 p, vec3 local ) {
  #ifdef VIENTO_HIERBA
    float peso = clamp( local.y * 2.4, 0.0, 1.0 ); peso *= peso;
  #elif defined( USE_COLOR_ALPHA )
    float peso = color.a;
  #else
    float peso = 0.0;
  #endif
  float t = uTiempo;
  float ola = sin( t * 1.5 + p.x * .42 + p.z * .31 ) * .6 + sin( t * 2.6 + p.x * 1.07 - p.z * .83 ) * .3 + sin( t * 4.3 + p.z * 1.9 + p.x * .2 ) * .1;
  vec3 d = vec3( ola, 0.0, ola * .45 ) * peso;
  #ifdef VIENTO_HIERBA
    d *= .1;
    vec2 aH = p.xz - uHeroe.xz; float dist = length( aH );
    float emp = ( 1.0 - smoothstep( .12, .8, dist ) ) * peso * step( abs( p.y - uHeroe.y ), .7 );
    d.xz += aH / max( dist, .001 ) * emp * .3; d.y -= emp * .14;
  #else
    d *= .06;
  #endif
  return d;
}
#endif
`;
THREE.ShaderChunk.project_vertex = `
vec4 posLocal = vec4( transformed, 1.0 );
#ifdef USE_BATCHING
  posLocal = batchingMatrix * posLocal;
#endif
#ifdef USE_INSTANCING
  posLocal = instanceMatrix * posLocal;
#endif
#if defined( VIENTO ) || defined( VIENTO_HIERBA )
  posLocal.xyz += desplazarViento( posLocal.xyz, transformed );
#endif
vec4 posMundo = modelMatrix * posLocal;
vMapa = ( uMundoInv * posMundo ).xyz;
vec4 mvPosition = viewMatrix * posMundo;
gl_Position = projectionMatrix * mvPosition;
`;
THREE.ShaderChunk.clipping_planes_fragment += `
#ifdef AVENTURA
  float niebla = 1.0;
  #ifndef SIN_NIEBLA
    vec2 dVent = abs( vMapa.xz - uVentana.xy ) - uVentana.zw;
    niebla = 1.0 - smoothstep( - uVentanaBorde, 0.0, max( dVent.x, dVent.y ) );
    if ( niebla < 0.004 ) discard;
  #endif
  #ifdef OCLUYE
    if ( uOclusion.z > 0.0 && gl_FragCoord.z < uOclusion.w ) {
      vec2 dO = ( gl_FragCoord.xy - uOclusion.xy ) / uOclusion.z;
      float o = length( vec2( dO.x, dO.y * 1.2 ) );
      if ( o < 1.0 && bayer4( gl_FragCoord.xy ) > smoothstep( .5, 1.0, o ) ) discard;
    }
  #endif
#endif
`;
THREE.ShaderChunk.color_fragment += `
#ifdef DETALLE
  float detalle = texture2D( uDetalle, vMapa.xz * .23 ).r * .55 + texture2D( uDetalle, vMapa.xz * 1.13 ).r * .45;
  diffuseColor.rgb *= .82 + detalle * .36;
#endif
`;
THREE.ShaderChunk.lights_fragment_end += `
#if defined( AVENTURA ) && ! defined( SIN_NUBES )
  float nube = 1.0 - uNubesFuerza * smoothstep( .42, .74, texture2D( uNubes, vMapa.xz * .031 + vec2( uTiempo * .011, uTiempo * .005 ) ).r );
  reflectedLight.directDiffuse *= nube;
  reflectedLight.directSpecular *= nube;
#endif
`;
THREE.ShaderChunk.dithering_fragment += `
#if defined( AVENTURA ) && ! defined( SIN_NIEBLA )
  gl_FragColor.rgb = mix( gl_FragColor.rgb, vec3( .86, .9, .95 ), ( 1.0 - niebla ) * .28 );
  #ifdef OPAQUE
    gl_FragColor = vec4( gl_FragColor.rgb * niebla, niebla );
  #else
    gl_FragColor.a *= niebla;
  #endif
#endif
`;
const inyectar = sh => { Object.assign(sh.uniforms, U); };
THREE.Material.prototype.onBeforeCompile = inyectar;

// =====================================================================
// TEXTURAS DE RUIDO (nubes, detalle del terreno) Y DE BRILLO, generadas por código
// =====================================================================
function texRuido(tam, periodo, octavas, semilla) {
  // ruido de valor periódico (se repite sin costuras); cada octava dobla la frecuencia
  const rv = (x, z, p) => {
    const h = (a, b) => hash((((a % p) + p) % p) * 57.3 + (((b % p) + p) % p) * 131.7 + semilla * 17.1 + p * 3.3);
    const xi = Math.floor(x), zi = Math.floor(z), fx = x - xi, fz = z - zi, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
    return lerp(lerp(h(xi, zi), h(xi + 1, zi), u), lerp(h(xi, zi + 1), h(xi + 1, zi + 1), u), v);
  };
  const d = new Uint8Array(tam * tam * 4);
  for (let y = 0; y < tam; y++) for (let x = 0; x < tam; x++) {
    let v = 0, a = .5, s = 0;
    for (let o = 0; o < octavas; o++) { const p = periodo << o; v += rv(x / tam * p, y / tam * p, p) * a; s += a; a *= .5; }
    const c = Math.round(v / s * 255), i = (y * tam + x) * 4;
    d[i] = d[i + 1] = d[i + 2] = c; d[i + 3] = 255;
  }
  const t = new THREE.DataTexture(d, tam, tam);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true; t.needsUpdate = true;
  return t;
}
U.uNubes.value = texRuido(128, 4, 4, 3);
U.uDetalle.value = texRuido(256, 16, 4, 9);
function texBrillo() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.35, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const TEX_BRILLO = texBrillo();

// =====================================================================
// MATERIALES. Casi todo lleva colores por vértice: así se juntan muchos objetos en una
// sola malla por trozo del mapa (pocas llamadas de dibujo, importante en las gafas).
// =====================================================================
function estandar(o, defines) {
  const m = new THREE.MeshStandardMaterial({ roughness: .8, metalness: 0, envMapIntensity: .5, ...o });
  if (defines) m.defines = defines;
  return m;
}
const MAT = {
  terreno: estandar({ vertexColors: true, roughness: .96, envMapIntensity: .22 }, { DETALLE: '' }),

    tr.grupo.visible = dx * dx + dz * dz < lejos * lejos && tr.x1 > v.x - v.z - m && tr.x0 < v.x + v.z + m && tr.z1 > v.y - v.w - m && tr.z0 < v.y + v.w + m;
  }
  // panel del HUD flotando delante de ti, algo por encima de la vista, de cara a la cabeza
  _a2.setFromMatrixPosition(cam.matrixWorld);
  _a1.set(0, 0, -2.6).applyAxisAngle(EJE_Y, VR.yawBase).add(VR.base); _a1.y = Math.max(_a2.y, 1) + .5;
  panelAR.position.copy(_a1);
  panelAR.rotation.set(0, Math.atan2(_a2.x - _a1.x, _a2.z - _a1.z), 0);
}

// =====================================================================
// MENÚS: título, pausa y "has caído"
// =====================================================================
function actualizarTitulo() {
  const ops = opcionesTitulo();
  if (CTL.arriba.pul) { TITULO.sel = (TITULO.sel + ops.length - 1) % ops.length; SND.menu(); }
  if (CTL.abajo.pul) { TITULO.sel = (TITULO.sel + 1) % ops.length; SND.menu(); }
  if (CTL.accion.pul || CTL.espada.pul) {
    SND.confirmar();
    empezar(ops[TITULO.sel] === 'Continuar' ? cargarPartida() : partidaNueva());
  }
}
function* esperarArea(id) { let a = null; prepararArea(id).then(x => { a = x; }); while (!a) yield; return a; }
function empezar(p) {
  J.partida = p; J.modo = 'juego'; J.iris = 0; J.control = false;
  J.heroe.modelo.visible = true;
  iniciarEscena((function* () {
    const area = yield* esperarArea(p.area);
    activarArea(area, p.x, p.z, p.dir);
    J.musica(area.exterior ? null : 'santuario');
    yield* animarIris(1, .8);
    if (!p.intro) yield* intro(); else { anunciarZona(area.nombre); J.control = true; }
    J.control = true;
  })());
}
function abrirPausa() { J.modal = 'pausa'; PAUSA.sel = 0; SND.menu(); }
function actualizarPausa() {
  const n = OPC_PAUSA().length;
  if (CTL.pausa.pul) { J.modal = null; SND.menu(); return; }
  if (CTL.arriba.pul) { PAUSA.sel = (PAUSA.sel + n - 1) % n; SND.menu(); }
  if (CTL.abajo.pul) { PAUSA.sel = (PAUSA.sel + 1) % n; SND.menu(); }
  if (CTL.accion.pul || CTL.espada.pul) {
    SND.confirmar();
    if (PAUSA.sel === 0) J.modal = null;
    else if (PAUSA.sel === 1) SND.silenciar();
    else if (PAUSA.sel === 2) { CAL.nivel = (CAL.nivel + 2) % 3; CAL.manual = true; aplicarCalidad(); }
    else { guardar(); renderer.xr.getSession()?.end(); location.href = '../../index.html'; }
  }
}
function actualizarMuerte() {
  if (MUERTE.t < 1.2) return;
  if (CTL.arriba.pul || CTL.abajo.pul) { MUERTE.sel = 1 - MUERTE.sel; SND.menu(); }
  if (CTL.accion.pul || CTL.espada.pul) { SND.confirmar(); if (MUERTE.sel === 0) revivir(); else { guardar(); location.reload(); } }
}

// =====================================================================
// ACTUALIZACIÓN Y BUCLE PRINCIPAL
// =====================================================================
let tHumo = 0, tAgua = 0, tVida = 0;
function cercaniaAgua() {
  const a = J.area, h = J.heroe; let n = 0;
  for (let dz = -3; dz <= 3; dz++) for (let dx = -3; dx <= 3; dx++) { const t = a.casilla(Math.floor(h.x) + dx, Math.floor(h.z) + dz); if (t.agua && !t.piedra) n++; }
  let c = n / 22;
  for (const k of a.cascadas || []) c = Math.max(c, 1.4 - Math.hypot(k.x - h.x, k.z - h.z) / 4);
  return clamp(c, 0, 1.4);
}
function animarAmbiente(dt) {
  for (const k in PART) PART[k].actualizar(dt);
  actualizarOndas(dt);
  const a = J.area;
  if ((tHumo -= dt) < 0) {
    tHumo = .22;
    for (const hm of a.humos) if (enVentana(hm.x, hm.z, 2)) PART.humo.emitir({ x: hm.x + azar(-.05, .05), y: hm.y, z: hm.z + azar(-.05, .05), vx: azar(.05, .25), vy: azar(.45, .8), vz: azar(-.1, .1), g: -.12, arr: .3, vida: azar(1.6, 2.4), tam: .07, tamFin: .26, color: 0xeeeef2, colorFin: 0xc4c8d4, giro: 0 });
    for (const c of a.cascadas || []) if (enVentana(c.x, c.z, 2)) for (let i = 0; i < 2; i++) PART.humo.emitir({ x: c.x + azar(-.45, .45), y: c.y + .05, z: c.z + azar(-.1, .2), vx: azar(-.3, .3), vy: azar(.3, .9), vz: azar(.1, .5), g: .5, arr: 1, vida: azar(.5, .9), tam: azar(.08, .14), tamFin: .02, color: 0xf4fbff, giro: 0 });
  }
  if (J.heroe && J.modo !== 'titulo') {
    if ((tAgua -= dt) < 0) { tAgua = .3; J.cercaAgua = cercaniaAgua(); }
    SND.actualizarAmbiente(dt, J.cercaAgua || 0);
  }
  const p = J.partida;
  if (p && p.vida > 0 && p.vida <= 2 && J.modo === 'juego' && !J.modal) { if ((tVida -= dt) < 0) { tVida = 2.4; SND.vidaBaja(); } } else tVida = .6;
}
function actualizar(dt) {
  J.tiempo += dt; U.uTiempo.value = J.tiempo;
  J.flashDano = Math.max(0, J.flashDano - dt * 2.5); J.temblor = Math.max(0, J.temblor - dt * 1.6); J.ayudaAR -= dt;
  actualizarAvisos(dt);
  const a = J.area;
  if (!a) return;
  if (J.modal !== 'pausa') for (const f of a.animados) f(J.tiempo, dt);
  if (J.modo === 'titulo') {
    actualizarTitulo();
    for (const e of a.entes) if (e instanceof Vecino) e.posar(dt);
    animarAmbiente(dt);
    return;
  }
  if (J.modal === 'dialogo') { actualizarDialogo(dt); for (const e of a.entes) if (e instanceof Vecino) e.posar(dt); }
  else if (J.modal === 'pausa') { actualizarPausa(); return; }
  else if (J.modal === 'muerte') actualizarMuerte();
  else if (CTL.pausa.pul && !J.escena && J.heroe.vivo && J.modo === 'juego') { abrirPausa(); return; }
  if (!J.modal) {
    if (J.pausaGolpe > 0) J.pausaGolpe -= dt;
    else {
      // (una escena puede lanzar otra al terminar: solo se borra si sigue siendo la misma)
      if (J.escena) { const e = J.escena; if (e.next().done && J.escena === e) J.escena = null; }
      J.heroe.actualizar(dt);
      for (const e of a.entes.slice()) if (e.vivo) e.actualizar(dt);
      a.entes = a.entes.filter(e => e.vivo);
      if (J.modo === 'juego') { actualizarSalas(); actualizarZona(); comprobarSalidas(); J.partida.tiempo += dt; }
    }
  }
  J.heroe.posar(dt);
  J.interaccion = buscarInteraccion();
  animarAmbiente(dt);
}
function pintarOverlay() {
  const cw = hudC.width, ch = hudC.height, s = Math.min(cw / 1280, ch / 720);
  hudG.setTransform(s, 0, 0, s, 0, 0);
  pintarHUD(hudG, cw / s, ch / s);
}
let ultimo = performance.now();
function bucle(ahora, frame) {
  const real = Math.max(0, (ahora - ultimo) / 1000), dt = Math.min(.05, real); ultimo = ahora;
  J.dt = dt;
  try {
    if (J.ar && frame) { leerXR(frame, dt); if (J.vr) posarVR(dt); else posarAR(dt); }
    leerEntrada(dt);
    actualizar(dt);
    if (!J.ar) { ajustarCamara(false); camara.updateMatrixWorld(); actualizarOclusion(); }
    mundo.updateMatrixWorld(); U.uMundoInv.value.copy(mundo.matrixWorld).invert();
    const fx = J.ar ? AR.foco.x : CAM.obj.x, fz = J.ar ? AR.foco.y : CAM.obj.z;
    sol.target.position.set(fx, 0, fz); sol.position.set(fx + SOL_DIR.x * 30, SOL_DIR.y * 30, fz + SOL_DIR.z * 30);
    if (J.ar) { pintarPanelAR(dt); avisoAR3D(); renderer.render(scene, camara); }
    else {
      if (CAL.post && POST.composer) {
        _p1.set(J.heroe?.x ?? CAM.obj.x, (J.heroe?.y ?? 0) + .5, J.heroe?.z ?? CAM.obj.z).applyMatrix4(mundo.matrixWorld).project(camara);
        POST.th.uniforms.foco.value = POST.tv.uniforms.foco.value = clamp((_p1.y + 1) / 2, .2, .8);
        POST.composer.render(dt);
      } else renderer.render(scene, camara);
      pintarOverlay();
      medirRendimiento(real);
    }
  } catch (e) { anotarError(e.message); console.error(e); }
}

// =====================================================================
// ARRANQUE
// =====================================================================
async function iniciar() {
  progreso(.04, 'Preparando…');
  await Promise.race([document.fonts.load('600 30px Fredoka'), new Promise(r => setTimeout(r, 2500))]).catch(() => {});
  prepararVegetacion(); prepararEfectos();
  J.heroe = new Heroe();
  J.partida = cargarPartida(); J.hayPartida = !!J.partida; if (!J.partida) J.partida = partidaNueva();
  progreso(.1, 'Construyendo el valle…');
  const valle = await construirArea('valle', f => progreso(.1 + f * .78));
  valle.mapaImg = crearMapaImg(valle); J.areas.valle = valle;
  activarArea(valle, 16.5, 28.7, 0);
  J.heroe.modelo.visible = false;
  J.modo = 'titulo'; TITULO.sel = 0;
  if (CAL.post) crearPost();
  progreso(.94, 'Preparando los shaders…'); await respiro();
  ajustarCamara(true); camara.updateMatrixWorld(); mundo.updateMatrixWorld(); U.uMundoInv.value.copy(mundo.matrixWorld).invert();
  try { renderer.compile(scene, camara); } catch {}
  progreso(1, '¡Listo!');
  const carga = document.getElementById('carga'); carga.style.opacity = 0; setTimeout(() => carga.remove(), 750);
  J.musica('titulo');
  renderer.setAnimationLoop(bucle);
}
iniciar().catch(e => { anotarError('Arranque: ' + e.message); console.error(e); cargaTxt.textContent = 'Error: ' + e.message; });
window.dbg = { J, CTL, CAL, AR, U, mundo, camara, renderer, scene, empezar, partidaNueva, guardar, prepararArea, activarArea, SND, TECLAS,
  ir: (area, x, z) => iniciarEscena(transicion(area, x, z, 0)), dar: t => { aplicarObjeto(t); }, };
</script>
