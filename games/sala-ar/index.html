<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala AR</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe-master.min.js"></script>
<script>
// Realidad mixta con passthrough: ves tu habitación real y encima una bandeja virtual
// con objetos. La bandeja se coloca poniendo el mando donde quieras (p. ej. sobre tu
// mesa real) y pulsando el gatillo; girando el mando (o con el joystick) se orienta.
// Los objetos se cogen con el botón de agarre o pellizcando; al soltarlos caen a la
// bandeja o al suelo real (y = 0 con local-floor).
const GRAB_DIST = 0.18;
const FLOOR = 0;
const BANDEJA = { w: 0.6, d: 0.4 };
const EJE_Y = new THREE.Vector3(0, 1, 0);

function bandejaObj() { return document.getElementById('bandeja').object3D; }
function bandeja() { return bandejaObj().position; }
// Punto p en coordenadas de la bandeja (que solo gira en torno al eje vertical)
function enBandeja(p) {
  const o = bandejaObj();
  return p.clone().sub(o.position).applyAxisAngle(EJE_Y, -o.rotation.y);
}
function sobreBandeja(l, m = 0) { return Math.abs(l.x) < BANDEJA.w / 2 + m && Math.abs(l.z) < BANDEJA.d / 2 + m; }

// Choques entre objetos (aproximados como cilindros verticales: radio horizontal
// data-radio, o data-size si no lo hay; media altura data-size).
// Si el objeto está por encima de otro, devuelve la altura a la que se apoya en él;
// si están al mismo nivel, los separa en horizontal para que no se atraviesen.
function colisiones(c) {
  const p = c.el.object3D.position;
  let apoyo = -Infinity;
  for (const el of document.querySelectorAll('.agarrable')) {
    const o = el.components.agarrable;
    if (!o || o === c || o.holder) continue;
    const q = el.object3D.position;
    const dx = p.x - q.x, dz = p.z - q.z;
    const dist = Math.hypot(dx, dz);
    const r = c.radio + o.radio;
    if (dist >= r) continue;
    const encima = p.y - q.y >= (c.size + o.size) * 0.5;
    if (encima) {
      apoyo = Math.max(apoyo, q.y + o.size + c.size);
    } else if (Math.abs(p.y - q.y) < c.size + o.size) {
      const n = dist > 1e-4 ? 1 / dist : 0;
      const empuje = (r - dist) / 2;
      p.x += (n ? dx * n : 1) * empuje;
      p.z += dz * n * empuje;
      c.vel.x *= 0.5; c.vel.z *= 0.5;
    }
  }
  return apoyo;
}

AFRAME.registerComponent('agarrable', {
  init() {
    this.el.classList.add('agarrable');
    this.vel = new THREE.Vector3();
    this.holder = null;
    this.size = parseFloat(this.el.getAttribute('data-size')) || 0.06;
    this.radio = parseFloat(this.el.getAttribute('data-radio')) || this.size;
    this.inicio = this.el.object3D.position.clone();   // posición relativa a la bandeja
  },
  volver() {
    // recoloca el objeto sobre la bandeja (al moverla o al pulsar A/X)
    if (this.holder) return;
    const off = this.inicio.clone().applyAxisAngle(EJE_Y, bandejaObj().rotation.y);
    this.el.object3D.position.copy(bandeja()).add(off);
    this.vel.set(0, 0, 0);
  },
  tick(t, dt) {
    if (this.holder || !dt) return;
    const s = Math.min(dt / 1000, 0.05);
    const p = this.el.object3D.position;
    this.vel.y -= 9.8 * s;
    p.addScaledVector(this.vel, s);
    const b = bandeja();
    const sobre = sobreBandeja(enBandeja(p));
    let ground = (sobre && p.y > b.y - 0.1 ? b.y + 0.02 : FLOOR) + this.size;
    ground = Math.max(ground, colisiones(this));
    if (p.y < ground) {
      p.y = ground;
      this.vel.y = Math.abs(this.vel.y) > 0.6 ? -this.vel.y * 0.35 : 0;
      this.vel.x *= 0.8; this.vel.z *= 0.8;
    }
  }
});

AFRAME.registerComponent('agarrador', {
  init() {
    this.held = null;
    this.prev = new THREE.Vector3();
    this.velocity = new THREE.Vector3();
    this.tmp = new THREE.Vector3();
    // el gatillo se reserva para colocar la bandeja
    for (const ev of ['gripdown', 'pinchstarted']) this.el.addEventListener(ev, () => this.grab());
    for (const ev of ['gripup', 'pinchended']) this.el.addEventListener(ev, () => this.release());
  },
  grab() {
    if (this.held) return;
    const hand = this.el.object3D.getWorldPosition(new THREE.Vector3());
    let best = null, bestD = GRAB_DIST;
    for (const el of document.querySelectorAll('.agarrable')) {
      const c = el.components.agarrable;
      if (c.holder) continue;
      const d = el.object3D.getWorldPosition(this.tmp).distanceTo(hand) - c.size;
      if (d < bestD) { bestD = d; best = el; }
    }
    if (!best) { this.cogerBandeja(hand); return; }
    this.held = best;
    best.components.agarrable.holder = this.el;
    this.el.object3D.attach(best.object3D);
    best.setAttribute('material', 'emissive', '#333');
    this.prev.copy(hand);
  },
  // Si no hay ningún objeto a mano pero sí la bandeja, se lleva la bandeja con lo que
  // tenga encima. Sigue a la mano sin inclinarse ni girar (la física la trata como rectángulo plano).
  cogerBandeja(hand) {
    const b = bandeja();
    if (!sobreBandeja(enBandeja(hand), 0.08) || Math.abs(hand.y - b.y) > 0.15) return;
    if ([...document.querySelectorAll('[agarrador]')].some(el => el.components.agarrador.llevaBandeja)) return;   // ya la lleva la otra mano
    this.llevaBandeja = { mano: b.clone().sub(hand), encima: [] };
    for (const el of document.querySelectorAll('.agarrable')) {
      const c = el.components.agarrable, p = el.object3D.position;
      if (c.holder) continue;
      if (sobreBandeja(enBandeja(p)) && p.y > b.y && p.y < b.y + 0.6) {
        c.holder = 'bandeja';
        this.llevaBandeja.encima.push({ c, off: p.clone().sub(b) });
      }
    }
    document.getElementById('bandeja').setAttribute('scale', '1.03 1.03 1.03');
  },
  release() {
    if (this.llevaBandeja) {
      const b = bandeja();
      b.y = Math.max(b.y, 0);
      for (const { c, off } of this.llevaBandeja.encima) {
        c.el.object3D.position.copy(b).add(off);
        c.holder = null;
        c.vel.set(0, 0, 0);
      }
      this.llevaBandeja = null;
      document.getElementById('bandeja').setAttribute('scale', '1 1 1');
      return;
    }
    if (!this.held) return;
    const el = this.held;
    el.sceneEl.object3D.attach(el.object3D);
    el.components.agarrable.holder = null;
    el.components.agarrable.vel.copy(this.velocity);
    el.setAttribute('material', 'emissive', '#000');
    this.held = null;
  },
  tick(t, dt) {
    if (!dt) return;
    const now = this.el.object3D.getWorldPosition(this.tmp);
    const v = now.clone().sub(this.prev).multiplyScalar(1000 / dt);
    this.velocity.lerp(v, 0.5);
    this.prev.copy(now);
    if (this.llevaBandeja) {
      const b = bandeja();
      b.copy(now).add(this.llevaBandeja.mano);
      for (const { c, off } of this.llevaBandeja.encima) c.el.object3D.position.copy(b).add(off);
    }
  }
});

// Gatillo: mientras se mantiene pulsado, la bandeja sigue al mando justo debajo de él y
// gira con él (su lado largo queda de través a donde apunta); al soltarlo se queda ahí.
// Joystick a izquierda/derecha: gira la bandeja poco a poco con lo que tenga encima.
// A / X: devuelve los objetos a la bandeja.
AFRAME.registerComponent('colocador', {
  init() {
    this.colocando = false;
    this.giro = 0;
    this.q = new THREE.Quaternion();
    this.el.addEventListener('triggerdown', () => { this.colocando = true; });
    this.el.addEventListener('triggerup', () => { this.colocando = false; });
    this.el.addEventListener('thumbstickmoved', e => { this.giro = Math.abs(e.detail.x) > 0.3 ? e.detail.x : 0; });
    for (const ev of ['abuttondown', 'xbuttondown']) this.el.addEventListener(ev, recolocar);
  },
  tick(t, dt) {
    if (!dt) return;
    if (this.colocando) this.colocar();
    else if (this.giro) girarBandeja(-this.giro * 1.5 * dt / 1000);
  },
  colocar() {
    const o = this.el.object3D;
    const p = o.getWorldPosition(new THREE.Vector3());
    const f = new THREE.Vector3(0, 0, -1).applyQuaternion(o.getWorldQuaternion(this.q));
    const b = bandejaObj();
    b.position.set(p.x, Math.max(p.y - 0.03, 0), p.z);
    if (Math.hypot(f.x, f.z) > 0.2) b.rotation.y = Math.atan2(-f.x, -f.z);   // apuntando casi en vertical no se cambia el giro
    recolocar();
  }
});

// Gira la bandeja sobre su centro y arrastra los objetos que estén encima
function girarBandeja(a) {
  const o = bandejaObj(), b = o.position;
  for (const el of document.querySelectorAll('.agarrable')) {
    const c = el.components.agarrable, p = el.object3D.position;
    if (c.holder || !sobreBandeja(enBandeja(p)) || p.y < b.y || p.y > b.y + 0.6) continue;
    p.copy(b).add(p.clone().sub(b).applyAxisAngle(EJE_Y, a));
  }
  o.rotation.y += a;
}

function recolocar() {
  for (const el of document.querySelectorAll('.agarrable')) el.components.agarrable.volver();
}

// Para probar en el monitor: clic para capturar el ratón (Esc lo suelta),
// clic izquierdo coge/suelta lo que haya en el centro, clic derecho lo lanza, R recoloca.
AFRAME.registerComponent('raton-agarre', {
  init() {
    this.held = null;
    this.ray = new THREE.Raycaster();
    this.ray.far = 3;
    this.el.sceneEl.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'r') recolocar();
      else if (k === 'q') girarBandeja(0.15);
      else if (k === 'e') girarBandeja(-0.15);
    });
    window.addEventListener('mousedown', e => {
      if (this.el.sceneEl.is('vr-mode') || this.el.sceneEl.is('ar-mode')) return;
      if (document.pointerLockElement !== this.el.sceneEl.canvas) return;
      if (this.held) this.release(e.button === 2 ? 6 : 0);
      else if (e.button === 0) this.grab();
    });
  },
  grab() {
    this.ray.setFromCamera({ x: 0, y: 0 }, this.el.getObject3D('camera'));
    const objs = [...document.querySelectorAll('.agarrable')].map(el => el.object3D);
    const hit = this.ray.intersectObjects(objs, true)[0];
    if (!hit) return;
    let o = hit.object;
    while (o && !o.el?.components?.agarrable) o = o.parent;
    if (!o) return;
    o = o.el.object3D;
    this.held = o.el;
    o.el.components.agarrable.holder = this.el;
    this.el.object3D.attach(o);
    o.position.set(0.15, -0.15, -0.5);
    o.el.setAttribute('material', 'emissive', '#333');
  },
  release(speed) {
    const el = this.held;
    el.sceneEl.object3D.attach(el.object3D);
    const g = el.components.agarrable;
    g.holder = null;
    this.el.object3D.getWorldDirection(g.vel).multiplyScalar(-speed);
    g.vel.y += speed * 0.3;
    el.setAttribute('material', 'emissive', '#000');
    this.held = null;
  }
});
</script>
<style>
  .back { position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff; background: rgba(0,0,0,.5);
          padding: 8px 12px; border-radius: 8px; font: 14px system-ui, sans-serif; text-decoration: none; }
</style>
</head>
<body>
<a class="back" href="../../index.html">← Arcade · <span class="ver">v14</span></a>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const s = document.querySelector('a-scene');
    const mira = v => document.querySelector('.mira').setAttribute('visible', v);
    s.addEventListener('enter-vr', () => mira(false));
    s.addEventListener('exit-vr', () => mira(true));
  });
</script>
<a-scene renderer="antialias: true; colorManagement: true"
         xr-mode-ui="enabled: true; XRMode: ar"
         webxr="referenceSpaceType: local-floor; optionalFeatures: local-floor, hand-tracking">

  <a-entity id="rig">
    <a-entity camera look-controls="pointerLockEnabled: true" wasd-controls raton-agarre position="0 1.6 0">
      <a-ring class="mira" radius-inner="0.004" radius-outer="0.007" position="0 0 -0.5"
              material="shader: flat; color: #fff; opacity: 0.8"></a-ring>
    </a-entity>
    <a-entity meta-touch-controls="hand: left" agarrador colocador></a-entity>
    <a-entity meta-touch-controls="hand: right" agarrador colocador></a-entity>
    <a-entity hand-tracking-controls="hand: left" agarrador></a-entity>
    <a-entity hand-tracking-controls="hand: right" agarrador></a-entity>
  </a-entity>

  <a-entity light="type: ambient; intensity: 0.7"></a-entity>
  <a-entity light="type: directional; intensity: 0.9" position="1 3 1"></a-entity>

  <!-- Solo en el monitor: en AR se ocultan y se ve la habitación real -->
  <a-sky color="#1c2230" hide-on-enter-ar></a-sky>
  <a-plane rotation="-90 0 0" width="6" height="6" color="#3a4150" hide-on-enter-ar></a-plane>
  <a-box position="0 0.36 -0.8" width="0.9" height="0.72" depth="0.6" color="#5a4a3a" hide-on-enter-ar></a-box>

  <!-- Bandeja (se recoloca con el gatillo) -->
  <a-entity id="bandeja" position="0 0.74 -0.8">
    <a-box width="0.6" height="0.02" depth="0.4" position="0 0.01 0"
           material="color: #9fd4ff; opacity: 0.55; transparent: true"></a-box>
    <a-box width="0.62" height="0.03" depth="0.02" position="0 0.015 0.2" color="#4a90d9"></a-box>
    <a-box width="0.62" height="0.03" depth="0.02" position="0 0.015 -0.2" color="#4a90d9"></a-box>
  </a-entity>

  <!-- Objetos: su posición es relativa a la bandeja y se aplica al cargar -->
  <a-box       agarrable data-size="0.05" position="-0.2 0.07 0" width="0.1" height="0.1" depth="0.1" material="color: #e8564d"></a-box>
  <a-sphere    agarrable data-size="0.06" position="-0.05 0.08 0.08" radius="0.06" material="color: #4a90d9"></a-sphere>
  <a-cylinder  agarrable data-size="0.07" data-radio="0.04" position="0.1 0.09 -0.05" radius="0.04" height="0.14" material="color: #ffcd75"></a-cylinder>
  <a-box       agarrable data-size="0.04" position="0.22 0.06 0.08" width="0.08" height="0.08" depth="0.08" material="color: #38b764"></a-box>
  <a-dodecahedron agarrable data-size="0.06" position="0.02 0.08 -0.12" radius="0.06" material="color: #b86bd9"></a-dodecahedron>
</a-scene>
<script>
  // al cargar, poner los objetos sobre la bandeja
  document.querySelector('a-scene').addEventListener('loaded', recolocar);
</script>
</body>
</html>
