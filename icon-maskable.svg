<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Versión maskable: Android recorta hasta un 20% por cada lado, así que todo
       el contenido va dentro del círculo central seguro. -->
  <rect width="512" height="512" fill="#0b1330"/>
  <g fill="#3ff0ff">
    <rect x="240" y="332" width="32" height="44" rx="4"/>
    <rect x="192" y="276" width="32" height="44" rx="4"/>
    <rect x="240" y="276" width="32" height="44" rx="4"/>
    <rect x="288" y="276" width="32" height="44" rx="4"/>
  </g>
  <g fill="#ffd24a">
    <rect x="248" y="204" width="16" height="40"/>
    <rect x="200" y="224" width="16" height="40"/>
    <rect x="296" y="224" width="16" height="40"/>
  </g>
  <rect x="152" y="136" width="96" height="56" rx="8" fill="rgba(61,255,158,.2)" stroke="#3dff9e" stroke-width="6"/>
  <rect x="264" y="136" width="96" height="56" rx="8" fill="rgba(255,154,60,.2)" stroke="#ff9a3c" stroke-width="6"/>
</svg>
