<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macedonia — Arcade</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#050a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  :root{
    --bg:#050a1a; --panel:#0b1330; --line:#1b2a55;
    --cyan:#3ff0ff; --magenta:#ff3fa8; --green:#3dff9e; --gold:#ffd24a;
    --text:#e8f2ff; --dim:#8ea3c9;
    --font:"Bahnschrift","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:var(--font); color:var(--text);
    background:
      radial-gradient(90% 60% at 50% -10%, #16295c 0%, transparent 60%),
      radial-gradient(60% 50% at 100% 100%, #2a0f3a 0%, transparent 60%),
      var(--bg);
    display:flex; flex-direction:column; align-items:center;
    padding:56px 20px 40px;
  }
  /* rejilla de fondo */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(90,140,230,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,140,230,.07) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(100% 70% at 50% 0%, #000 0%, transparent 75%);
  }
  header, main, footer{position:relative; z-index:1; width:100%; max-width:920px}

  header{text-align:center; margin-bottom:44px}
  .kicker{font-size:12px; letter-spacing:.42em; text-transform:uppercase; color:var(--dim)}
  h1{
    margin:12px 0 0; font-size:clamp(46px, 9vw, 84px); font-weight:800;
    letter-spacing:.1em; text-transform:uppercase; line-height:.95;
    background:linear-gradient(180deg, #ffffff, var(--cyan) 55%, #1a86d8);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 28px rgba(63,240,255,.35));
  }
  header p{margin:14px auto 0; max-width:420px; color:var(--dim); font-size:15px; line-height:1.6}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:18px}

  .card{
    position:relative; display:flex; flex-direction:column; gap:10px;
    padding:22px 22px 20px; border-radius:16px; text-decoration:none; color:inherit;
    background:linear-gradient(160deg, rgba(30,48,100,.55), rgba(10,17,42,.85));
    border:1px solid var(--line); overflow:hidden;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .card::after{
    content:""; position:absolute; inset:auto -30% -60% -30%; height:120px;
    background:radial-gradient(50% 100% at 50% 100%, var(--accent), transparent 70%);
    opacity:.28; transition:opacity .16s ease;
  }
  a.card:hover{transform:translateY(-4px); border-color:var(--accent);
               box-shadow:0 14px 40px rgba(0,0,0,.5)}
  a.card:hover::after{opacity:.5}

  .art{
    height:104px; border-radius:10px; border:1px solid var(--line);
    background:#060c20; display:grid; place-items:center; margin-bottom:4px;
  }
  .art svg{width:100%; height:100%}

  .row{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .card h2{margin:0; font-size:24px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
  .tag{
    font-size:10px; letter-spacing:.18em; text-transform:uppercase; padding:4px 9px;
    border-radius:999px; border:1px solid currentColor; color:var(--accent); white-space:nowrap;
  }
  .card p{margin:0; font-size:13.5px; line-height:1.55; color:var(--dim)}

  .card.soon{opacity:.5; cursor:default; --accent:#6d7fae}
  .card.soon .art{background:repeating-linear-gradient(45deg,#070d22,#070d22 10px,#0a1230 10px,#0a1230 20px)}

  footer{margin-top:40px; text-align:center; color:var(--dim); font-size:12px; letter-spacing:.14em;
         text-transform:uppercase}

  @media (prefers-reduced-motion:reduce){ .card{transition:none} a.card:hover{transform:none} }
</style>
</head>
<body>

<header>
  <div class="kicker">Macedonia</div>
  <h1>Arcade</h1>
  <p>Colección de prototipos jugables en el navegador. Elige uno y dale.</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>Instalable &middot; Sin servidor &middot; Funciona sin conexión</footer>

<script>
(() => {
'use strict';

/* Para añadir un juego nuevo: crea games/<slug>/index.html y añade una entrada aquí. */
const GAMES = [
  {
    slug: 'escuadron',
    name: 'Escuadrón',
    accent: '#3ff0ff',
    tag: 'Jugable',
    desc: 'Cruza puertas de multiplicadores, haz crecer tu escuadrón y arrasa los bloques que bajan.',
    art: `<svg viewBox="0 0 200 104" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="10" width="88" height="26" rx="3" fill="rgba(61,255,158,.16)" stroke="#3dff9e"/>
            <text x="52" y="28" font-size="16" font-weight="700" fill="#3dff9e" text-anchor="middle"
                  font-family="Bahnschrift, sans-serif">+18</text>
            <rect x="104" y="10" width="88" height="26" rx="3" fill="rgba(255,154,60,.16)" stroke="#ff9a3c"/>
            <text x="148" y="28" font-size="16" font-weight="700" fill="#ff9a3c" text-anchor="middle"
                  font-family="Bahnschrift, sans-serif">&#215;2</text>
            <rect x="96" y="46" width="4" height="12" fill="#ffd24a"/>
            <rect x="76" y="52" width="4" height="12" fill="#ffd24a"/>
            <rect x="120" y="52" width="4" height="12" fill="#ffd24a"/>
            <g fill="#3ff0ff">
              <rect x="96" y="86" width="8" height="11"/>
              <rect x="84" y="74" width="8" height="11"/><rect x="96" y="74" width="8" height="11"/>
              <rect x="108" y="74" width="8" height="11"/>
            </g>
          </svg>`
  },
  {
    slug: 'convoy',
    name: 'Convoy',
    accent: '#ffb03a',
    tag: 'Jugable',
    desc: 'Aguanta la carretera: las puertas suben tu potencia de fuego y la horda te quita vida.',
    art: `<svg viewBox="0 0 200 104" xmlns="http://www.w3.org/2000/svg">
            <rect width="200" height="104" fill="#d8d2c4"/>
            <path d="M60 104 L84 30 L116 30 L140 104 Z" fill="#74777c"/>
            <path d="M96 104 L99 30 L101 30 L104 104 Z" fill="#efece4" opacity=".85"/>
            <path d="M60 104 L84 30 L88 30 L68 104 Z" fill="#c2b294"/>
            <path d="M140 104 L116 30 L112 30 L132 104 Z" fill="#c2b294"/>
            <rect x="78" y="40" width="20" height="11" rx="2" fill="rgba(74,222,128,.3)" stroke="#4ade80"/>
            <rect x="102" y="40" width="20" height="11" rx="2" fill="rgba(255,138,60,.3)" stroke="#ff8a3c"/>
            <g fill="#e8564d">
              <rect x="88" y="24" width="5" height="8" rx="1.5"/>
              <rect x="97" y="24" width="5" height="8" rx="1.5"/>
              <rect x="106" y="24" width="5" height="8" rx="1.5"/>
            </g>
            <path d="M97 88 L99 60 L101 60 L103 88 Z" fill="#9fe8ff" opacity=".85"/>
            <g fill="#4a90d9">
              <rect x="94" y="86" width="12" height="14" rx="3"/>
            </g>
            <circle cx="100" cy="83" r="5" fill="#f6cba4"/>
            <path d="M95 82 a5 5 0 0 1 10 0 z" fill="#1f6f9e"/>
          </svg>`
  }
];

const SOON = [
  { name: 'Próximamente', desc: 'Hueco reservado para el siguiente juego de la colección.' }
];

const grid = document.getElementById('grid');

for (const g of GAMES) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = 'games/' + g.slug + '/index.html';
  a.style.setProperty('--accent', g.accent);
  a.innerHTML =
    '<div class="art">' + g.art + '</div>' +
    '<div class="row"><h2></h2><span class="tag"></span></div>' +
    '<p></p>';
  a.querySelector('h2').textContent   = g.name;
  a.querySelector('.tag').textContent = g.tag;
  a.querySelector('p').textContent    = g.desc;
  grid.appendChild(a);
}

for (const s of SOON) {
  const d = document.createElement('div');
  d.className = 'card soon';
  d.innerHTML = '<div class="art"></div><div class="row"><h2></h2></div><p></p>';
  d.querySelector('h2').textContent = s.name;
  d.querySelector('p').textContent  = s.desc;
  grid.appendChild(d);
}
})();
</script>
<script>
  /* Registro del service worker: sin el, Chrome no ofrece instalar en Android.
     Falla a proposito en file://, asi que se comprueba antes. */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
